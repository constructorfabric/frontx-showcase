name: Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The image as the Dockerfile builds it, against a local origin, then started and checked by deploy/smoke.sh. Nothing is pushed; on pull requests and pushes to main this job is the whole run.
  build:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: docker-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build the image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        platforms: linux/amd64
        build-args: SITE_ORIGIN=http://localhost:8080
        tags: frontx-site:ci
        load: true
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke-test the container
      run: deploy/smoke.sh frontx-site:ci http://localhost:8080

  # A tag run checks its tag whether or not the image can be published yet: a tag that is not a plain vX.Y.Z on a commit of main fails the run, so it never publishes and never deploys.
  release-check:
    name: Check the release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Check the tag and list its image tags
      env:
        SHA: ${{ github.sha }}
        TAG: ${{ github.ref_name }}
      run: deploy/release-tags.sh "$TAG" "$SHA"

  # Publishes the image to GHCR from a version tag vX.Y.Z on a commit of main, as X.Y.Z and the commit sha, as X.Y for the highest patch of its line and as latest for the highest release; pushes to main publish nothing, so a deploy always follows a released version. The image bakes in its origin, so this job waits for the production one: it runs once the repository variable SITE_ORIGIN holds the address the site is served from (https://<domain>, with the sub-path if any). The image is smoke-tested with that origin before it is pushed, and a successful run is what the deploy webhook (deploy/webhook/) acts on.
  publish:
    name: Publish the image
    needs: [ build, release-check ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.SITE_ORIGIN != ''
    # One publish at a time, so each run decides X.Y and latest against every release published before it. GitHub keeps one waiting run per group: a third tag pushed while one waits replaces the waiting one, which then needs a re-run.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
    # Full history and tags, for deploy/release-tags.sh.
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build the image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        platforms: linux/amd64
        build-args: SITE_ORIGIN=${{ vars.SITE_ORIGIN }}
        tags: frontx-site:publish
        load: true
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke-test the container
      env:
        SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      run: deploy/smoke.sh frontx-site:publish "$SITE_ORIGIN"

    - name: Log in to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # The image the smoke test checked, pushed as is under each tag deploy/release-tags.sh lists.
    - name: Push the image
      env:
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        TAG: ${{ github.ref_name }}
      run: |
        tags="$(deploy/release-tags.sh "$TAG" "$SHA")"
        printf 'image tags:\n%s\n' "$tags"
        IMAGE="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
        for tag in $tags; do
          docker tag frontx-site:publish "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
        done
