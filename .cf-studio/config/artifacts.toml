# Studio artifacts registry
#
# The root system, slug site and ids cpt-site-*, describes this repository: the site-level intent, the repository tooling in scripts/, the shell layout and the shell files the site has changed. Its documents live in architecture/.
#
# Every template of this repository (a top-level directory with a frontx-template.json manifest: template-site, template-catalogue, template-inbox, template-mfe-demo, template-calendar-demo, template-site-meta, template-site-brand, template-kit-candidates, template-site-blocks) has its own system over <template>/architecture, with slug template-<name> and ids cpt-template-<name>-*. Registration is by hand, because auto-discovered child systems would take the parent's prefix. Each template's tree is self-contained: its own PRD, DESIGN, DECOMPOSITION, FEATUREs and ADRs, citing another tree, the root one included, by a link to its document and never by its ids, so the template validates unchanged wherever it moves (cpt-site-adr-template-territory-traceability, architecture/ADR/0001-template-territory-traceability.md).
#
# Every kind of every system is traceability = "FULL" and required = true: each system has its PRD, DESIGN, ADRs, DECOMPOSITION and FEATUREs.
#
# Markers in template territory bind only to that template's own artifact tree; a cpt-frontx-* marker anywhere binds nothing. No document here carries a cpt-frontx-* id and no cpt-frontx-* marker is added to code: a gears-frontx decision is cited as plain text, such as FrontX ADR-0033, or as a link to its file. The cpt-frontx-* markers under site/ are residue of the official templates' archived gears-frontx generation; their paths are never registered, and a site-changed file loses them in the change that touches it.
#
# Each system registers its own code ([[systems.codebase]] under its block): the root registers scripts/ and the site-owned shell code under site/, and each template registers its <template>/src-app. Nothing under site/ is registered except the site-owned code: site/src-app/mfe_packages/ and the template packages in site/src-app/verify_packages/ are composed copies of the templates, and the rest is applied official template payload.
#
# cfs v1.6.2 keeps all ids in one set, so review checks what it does not: that each system's documents carry only ids with that system's prefix, that a template's markers name only that template's ids, and that no document carries a cpt-frontx-* id. cfs accepts an id defined in any system in any document or marker, and it does not report a reference outside the registered prefixes.

[[ignore]]
reason = "Dependencies and build output are not source. A template directory can hold an installed node_modules (template-catalogue's catalogue-mfe does), so the pattern matters once that template's code is registered."
patterns = ["*/node_modules/*", "*/dist/*"]

[[ignore]]
reason = "Test files and test helpers verify behaviour rather than implement it; tests cite scenarios, not CDSL begin/end markers."
patterns = ["*.test.*", "*.spec.*", "*/test-support/*", "*/__tests__/*"]

[[ignore]]
reason = "Build and test configuration files implement no behaviour a numbered instruction specifies, so no marker has an instruction to point at."
patterns = ["*/vite.config.*", "*/vitest.config.*"]

[[ignore]]
reason = "The catalogue's example files, foundation pages and shared.tsx are generated by catalogue-mfe/scripts/generate-catalogue.mjs from the ui-kit demo at the pinned release (the include list of kit-demo/kit-demo.lock.json) and are overwritten on every regeneration, so a marker there would not survive; they exercise the kit's public surface rather than implement a requirement. The generator itself stays scanned."
patterns = ["template-catalogue/src-app/mfe_packages/catalogue-mfe/src/examples/*", "template-catalogue/src-app/mfe_packages/catalogue-mfe/src/pages/*", "template-catalogue/src-app/mfe_packages/catalogue-mfe/src/shared.tsx"]

[[ignore]]
reason = "Block showcase fixtures (*.showcase.*) are sample content that the showcase screens and the block tests render; they implement no numbered instruction. A block folder's index.ts only re-exports the block, so it has no behaviour of its own to mark."
patterns = ["*.showcase.*", "*/blocks/*/index.ts"]

# The repository: ids cpt-site-*.
[[systems]]
name = "FrontX site"
slug = "site"
kit = "sdlc"
artifacts_dir = "architecture"

[[systems.autodetect]]
kit = "sdlc"
system_root = "{project_root}"
artifacts_root = "architecture"

[systems.autodetect.artifacts]
[systems.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "FULL"
required = true

[systems.autodetect.artifacts.DESIGN]
pattern = "DESIGN.md"
traceability = "FULL"
required = true

[systems.autodetect.artifacts.DECOMPOSITION]
pattern = "DECOMPOSITION.md"
traceability = "FULL"
required = true

[systems.autodetect.artifacts.ADR]
pattern = "ADR/**/*.md"
traceability = "FULL"
required = true

[systems.autodetect.artifacts.FEATURE]
pattern = "features/*/FEATURE.md"
traceability = "FULL"
required = true

[[systems.codebase]]
path = "scripts/"
extensions = [".mjs"]

[[systems.codebase]]
path = "site/src-app/app/layout/"
extensions = [".ts", ".tsx"]

[[systems.codebase]]
path = "site/src-app/app/App.tsx"
extensions = [".tsx"]

[[systems.codebase]]
path = "site/src-app/app/main.tsx"
extensions = [".tsx"]

[[systems.codebase]]
path = "site/src-app/app/mfe/bootstrap.ts"
extensions = [".ts"]

[[systems.codebase]]
path = "site/src-app/app/mfe/MfeScreenContainer.tsx"
extensions = [".tsx"]

[[systems.codebase]]
path = "site/src-app/app/mfe/screenLoadFailure.ts"
extensions = [".ts"]

[[systems.codebase]]
path = "site/src-app/app/mfe/hostTheme.ts"
extensions = [".ts"]

[[systems.codebase]]
path = "site/src-app/app/documentEntries.ts"
extensions = [".ts"]

[[systems.codebase]]
path = "site/src-app/app/themes/"
extensions = [".ts"]

[[systems.codebase]]
path = "site/scripts/dev-all.ts"
extensions = [".ts"]

